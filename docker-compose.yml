services:
  app:
    build:
      context: .
      target: development
    ports:
      - "4000:4000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./prisma:/app/prisma
      - ./.env:/app/.env
      - ./uploads:/app/public/uploads
    command: npm run dev
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=postgresql://user:password@db:5432/dashboard?schema=public
      - AUTH_TRUST_HOST=true
      - AUTHENTIK_PCO_CLIENT_ID=${AUTHENTIK_PCO_CLIENT_ID}
      - AUTHENTIK_PCO_CLIENT_SECRET=${AUTHENTIK_PCO_CLIENT_SECRET}
      - AUTHENTIK_PCO_ISSUER=${AUTHENTIK_PCO_ISSUER:-https://auth.server.mtcd.org/application/o/home-dashboard-pco/}
      - AUTHENTIK_MS_CLIENT_ID=${AUTHENTIK_MS_CLIENT_ID}
      - AUTHENTIK_MS_CLIENT_SECRET=${AUTHENTIK_MS_CLIENT_SECRET}
      - AUTHENTIK_MS_ISSUER=${AUTHENTIK_MS_ISSUER:-https://auth.server.mtcd.org/application/o/home-dashboard-ms/}
      - AUTHENTIK_CC_CLIENT_ID=${AUTHENTIK_CC_CLIENT_ID}
      - AUTHENTIK_CC_CLIENT_SECRET=${AUTHENTIK_CC_CLIENT_SECRET}
      - AUTHENTIK_CC_ISSUER=${AUTHENTIK_CC_ISSUER:-https://auth.server.mtcd.org/application/o/home-dashboard-cc/}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=dashboard
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
