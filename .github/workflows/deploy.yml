name: Build, Push, and Deploy

on:
  push:
    branches:
      - main
      - abraham-prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get package version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: mtcdtech/homedashboard:latest,mtcdtech/homedashboard:v${{ env.VERSION }},mtcdtech/homedashboard:${{ github.sha }}
          cache-from: type=registry,ref=mtcdtech/homedashboard:buildcache
          cache-to: type=registry,ref=mtcdtech/homedashboard:buildcache,mode=max

  deploy-to-portainer:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests
      - name: Trigger Portainer Updates
        env:
          GITHUB_SHA: ${{ github.sha }}
          AUTH_MICROSOFT_ENTRA_ID_SECRET: ${{ secrets.AUTH_MICROSOFT_ENTRA_ID_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          PORTAINER_API_KEY_CHURCH: ${{ secrets.PORTAINER_API_KEY_CHURCH }}
          AUTHENTIK_PCO_CLIENT_ID: ${{ secrets.AUTHENTIK_PCO_CLIENT_ID }}
          AUTHENTIK_PCO_CLIENT_SECRET: ${{ secrets.AUTHENTIK_PCO_CLIENT_SECRET }}
          AUTHENTIK_PCO_ISSUER: ${{ secrets.AUTHENTIK_PCO_ISSUER }}
          AUTHENTIK_MS_CLIENT_ID: ${{ secrets.AUTHENTIK_MS_CLIENT_ID }}
          AUTHENTIK_MS_CLIENT_SECRET: ${{ secrets.AUTHENTIK_MS_CLIENT_SECRET }}
          AUTHENTIK_MS_ISSUER: ${{ secrets.AUTHENTIK_MS_ISSUER }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PORTAINER_API_KEY_ABRAHAM: ${{ secrets.PORTAINER_API_KEY_ABRAHAM }}
        run: python update_portainer.py

